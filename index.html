<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPPE Delivery and Impact Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f3f6f6; --panel: #ffffff; --panel2: #eef3f3; --line: #d9e2e3; --fg: #15232b; --muted: #5b6b73;
  --navy: #1f2a37; --navy2: #2c3a4a; --teal: #13868f; --teal-ink: #0b5f68; --teal-soft: #dcefef;
  --ok: #1e8a4c; --ok-soft: #e1f3e8; --warn: #a96500; --warn-soft: #fcefd9; --bad: #b83a30; --bad-soft: #f9e2df;
  --font: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif; --radius: 10px;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f171c; --panel: #17232a; --panel2: #1e2c34; --line: #2c3d46; --fg: #e6eef0; --muted: #9db0b8;
    --navy: #0b1218; --navy2: #1b2833; --teal: #3fb2b9; --teal-ink: #8fd9dd; --teal-soft: #173a3e;
    --ok: #5fcf8e; --ok-soft: #173826; --warn: #f2b45a; --warn-soft: #3a2a12; --bad: #f08a80; --bad-soft: #3d1d1a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f171c; --panel: #17232a; --panel2: #1e2c34; --line: #2c3d46; --fg: #e6eef0; --muted: #9db0b8;
  --navy: #0b1218; --navy2: #1b2833; --teal: #3fb2b9; --teal-ink: #8fd9dd; --teal-soft: #173a3e;
  --ok: #5fcf8e; --ok-soft: #173826; --warn: #f2b45a; --warn-soft: #3a2a12; --bad: #f08a80; --bad-soft: #3d1d1a;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--navy); color: #fff; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; }
.brand-t { font-weight: 800; font-size: 16px; margin: 0; line-height: 1.2; letter-spacing: -.01em; }
.brand-s { margin: 2px 0 0; font-size: 12px; color: #a8b6c4; font-weight: 600; }
.sh { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 8px; color: #fff; }
.slab { font-size: 12px; font-weight: 600; margin: 12px 0 6px; color: #dfe7ee; }
.nav { display: flex; flex-direction: column; gap: 6px; }
.navbtn { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-radius: 9px; padding: 10px 12px; background: var(--navy2); color: #dfe7ee; font-size: 14px; font-weight: 700; text-align: left; }
.navbtn svg { flex: none; }
.navbtn:hover { background: #374759; }
.navbtn.on { background: #fff; color: var(--navy); }
.navbtn .n { margin-left: auto; background: var(--warn); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 7px; }
.seg { display: flex; flex-wrap: wrap; background: var(--navy2); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { flex: 1 1 auto; border: 0; background: transparent; color: #a8b6c4; padding: 6px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.seg button.on { background: #fff; color: var(--navy); font-weight: 700; }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #dfe7ee; background: var(--navy2); border-radius: 9px; padding: 8px 10px; }
.who img { width: 28px; height: 28px; border-radius: 50%; }
.who .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.role { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: #13868f; color: #fff; white-space: nowrap; }
.period-nav { display: flex; align-items: center; gap: 6px; }
.icon-btn { border: 1px solid rgba(255,255,255,.25); background: transparent; color: #fff; width: 34px; height: 34px; border-radius: 8px; font-size: 18px; flex: none; }
.period-sel { flex: 1; min-width: 0; background: var(--navy2); color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 7px 8px; }
.side-sub { margin: 8px 0 0; font-size: 12px; color: #a8b6c4; }
.legend { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #a8b6c4; }
.legend-bar { display: flex; flex: 1; height: 16px; border-radius: 3px; overflow: hidden; }
.legend-bar span { flex: 1; }
.fdet summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.fdet summary::-webkit-details-marker { display: none; }
.fdet summary::after { content: '▾'; font-size: 12px; color: #a8b6c4; }
.fdet:not([open]) summary::after { content: '▸'; }
.side-reset { width: 100%; margin-top: 12px; border: 1px solid rgba(255,255,255,.25); background: transparent; color: #fff; font-size: 12px; padding: 7px 10px; border-radius: 8px; }
.side-foot { margin-top: auto; font-size: 11px; color: #a8b6c4; line-height: 1.45; }
.mainwrap { min-width: 0; background: var(--bg); }
.phead { max-width: 1180px; margin: 0 auto; padding: 24px 24px 0; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 16px; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--teal-ink); width: 100%; }
.period-h { margin: 0; font-size: clamp(26px, 4.5vw, 40px); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
.period-sub { margin: 0 0 4px; color: var(--muted); font-size: 14px; }
.main { max-width: 1180px; margin: 0 auto; padding: 18px 24px 60px; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; gap: 14px; padding: 16px; }
  .nav { flex-direction: row; overflow-x: auto; }
  .navbtn { width: auto; white-space: nowrap; flex: none; }
  .side-foot { margin-top: 0; }
  .side-legend, .side-foot { display: none; }
  .phead, .main { padding-left: 16px; padding-right: 16px; }
}
.note { color: var(--muted); font-size: 14px; margin: 0 0 16px; max-width: 75ch; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.pad { padding: 18px 20px; }
.empty { padding: 32px 24px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px; }
.banner { border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; background: var(--teal-soft); color: var(--teal-ink); }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.h2 { font-size: 18px; font-weight: 700; margin: 26px 0 10px; }
.h3 { font-size: 15px; font-weight: 700; margin: 0 0 8px; }
.types { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.type { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 14px; display: grid; gap: 4px; }
.type:hover { border-color: var(--teal); }
.type.on { border-color: var(--teal); box-shadow: inset 0 0 0 1px var(--teal); background: var(--teal-soft); }
.type .ic { font-size: 22px; line-height: 1; }
.type b { font-size: 14px; }
.type span { font-size: 12px; color: var(--muted); }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 16px; margin-top: 4px; }
.f { display: grid; gap: 4px; min-width: 0; }
.f.wide { grid-column: 1 / -1; }
.f label { font-size: 13px; font-weight: 600; }
.f .hint { font-size: 12px; color: var(--muted); }
.field { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; }
.field:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px var(--teal-soft); }
.field.num { text-align: right; font-variant-numeric: tabular-nums; }
.field.invalid { border-color: var(--bad); }
.err { color: var(--bad); font-size: 12px; margin: 0; }
.grid5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.grid5 .f label { font-weight: 500; font-size: 12px; color: var(--muted); }
.sumline { font-size: 13px; color: var(--muted); }
.sumline b { color: var(--fg); }
.contrib { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.contrib span { background: var(--teal-soft); color: var(--teal-ink); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
.warnbox { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--panel2); }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .55; cursor: default; }
.chip { display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.st-pending { background: var(--warn-soft); color: var(--warn); }
.st-approved { background: var(--ok-soft); color: var(--ok); }
.st-returned { background: var(--bad-soft); color: var(--bad); }
.ps-met, .ps-review { color: var(--ok); } .ps-ontrack { color: var(--teal); } .ps-atrisk { color: var(--warn); } .ps-behind { color: var(--bad); }
.item { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--line); align-items: start; }
.item:first-child { border-top: 0; }
.item .ic { font-size: 20px; line-height: 1.2; }
.item-t { font-weight: 700; margin: 0; }
.item-m { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.item-r { display: grid; gap: 6px; justify-items: end; }
.retbox { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 6px 10px; font-size: 13px; margin-top: 6px; }
.file-link { font-size: 13px; color: var(--teal-ink); margin-right: 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.card .l { font-size: 13px; color: var(--muted); margin: 0; }
.card .v { font-size: 30px; font-weight: 800; margin: 2px 0 0; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.card .v small { font-size: 15px; font-weight: 600; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.kpirow { cursor: pointer; }
tr.kpirow:hover td { background: var(--panel2); }
tr.persp-row td { background: var(--panel2); font-size: 12px; font-weight: 700; color: var(--muted); padding: 6px 12px; }
tr.drill td { background: var(--panel2); padding: 4px 12px 14px 32px; }
.drill-list { display: grid; gap: 4px; font-size: 13px; }
.drill-list div { display: flex; gap: 10px; justify-content: space-between; border-bottom: 1px dashed var(--line); padding: 4px 0; }
.mini { height: 6px; background: var(--panel2); border-radius: 999px; overflow: hidden; margin-top: 4px; min-width: 60px; position: relative; }
.mini span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; }
.mini i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--fg); opacity: .5; }
.bd { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }
.bdrow { display: grid; grid-template-columns: minmax(0, 9em) 1fr 4.5em; gap: 8px; align-items: center; font-size: 13px; margin: 6px 0; }
.bdbar { height: 12px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
.bdbar span { display: block; height: 100%; background: var(--teal); }
.bdrow .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.rev { display: grid; grid-template-columns: 24px minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; padding: 16px 18px; border-top: 1px solid var(--line); align-items: start; }
.rev:first-child { border-top: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; margin-top: 6px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.dict { display: grid; gap: 12px; }
.dict .panel { padding: 16px 18px; }
.dict-h { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; justify-content: space-between; }
.dict-h b { font-size: 15px; }
.dict dl { display: grid; grid-template-columns: minmax(0, 11em) 1fr; gap: 6px 14px; font-size: 14px; margin: 10px 0 0; }
.dict dt { color: var(--muted); font-size: 13px; }
.dict dd { margin: 0; }
.months12 { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.months12 label { font-size: 11px; color: var(--muted); }
.pics { display: flex; flex-wrap: wrap; gap: 6px; }
.pic { display: inline-flex; align-items: center; gap: 4px; background: var(--teal-soft); color: var(--teal-ink); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 12px; font-weight: 600; }
.pic button { border: 0; background: transparent; color: inherit; width: 20px; height: 20px; border-radius: 50%; line-height: 1; }
.search-box { position: relative; }
.results { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12); max-height: 220px; overflow-y: auto; }
.results button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 12px; font-size: 14px; }
.results button:hover { background: var(--panel2); }
.dfilter { display: flex; flex-wrap: wrap; gap: 4px; background: var(--panel2); border-radius: 8px; padding: 3px; margin-bottom: 16px; width: fit-content; max-width: 100%; }
.dfilter button { border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; }
.dfilter button.on { background: var(--teal); color: #fff; }
.hero { position: relative; overflow: hidden; border-radius: 14px; color: #fff; padding: 22px 26px; margin-bottom: 18px; background: linear-gradient(115deg, #0b5f68 0%, #13868f 45%, #2aa7ad 70%, #13868f 100%); background-size: 220% 100%; }
.hero::after { content: ""; position: absolute; right: -70px; top: -90px; width: 280px; height: 280px; border-radius: 50%; background: rgba(255,255,255,.07); pointer-events: none; }
.hero-in { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 32px; }
.hero-num { margin: 0; font-size: clamp(56px, 11vw, 100px); font-weight: 800; line-height: .95; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.hero-num small { font-size: .42em; font-weight: 600; opacity: .8; }
.hero-side { flex: 1 1 240px; min-width: 0; }
.hero-lab { margin: 0 0 8px; font-size: clamp(20px, 3vw, 30px); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; line-height: 1.1; }
.hero-bar { height: 12px; border-radius: 999px; background: rgba(255,255,255,.22); overflow: hidden; }
.hero-bar span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #c9fff4, #fff); }
.hero-sub { margin: 8px 0 0; font-size: 13px; opacity: .92; }
.hero-stats { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 10px 0 0; font-size: 13px; }
.hero-stats b { font-size: 1.15em; font-weight: 800; }
.hero-stats i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #fff; margin-right: 5px; vertical-align: -1px; }
@media (prefers-reduced-motion: no-preference) { .hero { animation: sheen 14s ease-in-out infinite alternate; } .hero-bar span { transition: width 1.2s cubic-bezier(.2,.8,.2,1); } @keyframes sheen { from { background-position: 0% 50%; } to { background-position: 100% 50%; } } }
.dcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
.dcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 10px; min-width: 0; text-align: left; }
.dcard:hover { border-color: var(--teal); }
.dcard .l { font-size: 12px; color: var(--muted); font-weight: 600; margin: 0; }
.dcard .v { font-size: 24px; font-weight: 800; margin: 4px 0 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; line-height: 1.15; }
.dcard .s { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
.dcard svg { display: block; width: 100%; height: 44px; margin-top: 6px; }
.drow { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }
.dbars { display: grid; gap: 5px; }
.dbar { position: relative; height: 30px; background: var(--panel2); border-radius: 3px; overflow: hidden; border: 0; padding: 0; width: 100%; text-align: left; }
.dbar.sel { outline: 2px solid var(--fg); outline-offset: 1px; }
.dbar .fill { position: absolute; inset: 0 auto 0 0; }
.dbar .goal { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: var(--fg); opacity: .35; }
.dbar .exp { position: absolute; top: 0; bottom: 0; border-left: 2px dashed var(--fg); opacity: .5; }
.dbar .lab { position: absolute; inset: 0 8px; display: flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; overflow: hidden; }
.dbar .lab .nm { overflow: hidden; text-overflow: ellipsis; }
.dbar .lab b { font-variant-numeric: tabular-nums; }
.dbar .chip2 { margin-left: auto; flex: none; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; color: #fff; }
.dchart { width: 100%; }
.dchart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.dchart .lbl { fill: var(--fg); font-weight: 700; }
.heat { border-collapse: separate; border-spacing: 3px; font-size: 12px; width: 100%; }
.heat th { font-size: 11px; color: var(--muted); padding: 2px 6px; text-align: center; white-space: nowrap; border: 0; }
.heat th.k, .heat td.k { text-align: left; white-space: nowrap; max-width: 18em; overflow: hidden; text-overflow: ellipsis; border: 0; padding: 4px 8px 4px 0; }
.heat td.c { text-align: center; border-radius: 3px; padding: 6px 4px; min-width: 3.2em; border: 0; font-variant-numeric: tabular-nums; }
.heat td.t { text-align: right; font-weight: 700; border: 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
.heat td.p { text-align: center; color: #fff; font-weight: 700; border-radius: 3px; border: 0; padding: 4px 6px; }
@media (max-width: 860px) { .drow { grid-template-columns: minmax(0, 1fr); } }
.fbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.fbar .field { width: auto; min-width: 180px; flex: 1 1 200px; max-width: 320px; }
.fbar select.field { flex: 0 1 200px; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--panel2); border-radius: 8px; padding: 3px; }
.chips button { border: 0; background: transparent; color: var(--muted); padding: 5px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; }
.chips button.on { background: var(--teal); color: #fff; }
.chips button .c { opacity: .75; font-weight: 500; margin-left: 4px; }
.clk { cursor: pointer; }
.item.clk:hover, .rev .clk:hover { background: var(--panel2); }
.item-open { border: 0; background: transparent; padding: 0; text-align: left; cursor: pointer; width: 100%; }
.item-open:hover .item-t { color: var(--teal-ink); text-decoration: underline; }
.drill-list button { border: 0; background: transparent; padding: 4px 0; width: 100%; display: flex; gap: 10px; justify-content: space-between; border-bottom: 1px dashed var(--line); text-align: left; font-size: 13px; }
